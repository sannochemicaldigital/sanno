<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Order — Sanno Accounting</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>Delivery Order</h1>
      <button class="btn btn-danger" id="logoutBtn">Keluar</button>
    </div>

    <nav class="nav" id="mainNav"></nav>

    <div class="card">
      <h3 style="margin-top:0;font-size:16px;">Daftar Delivery Order</h3>

      <!-- ===== Filter bar ===== -->
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center;">
        <select id="filterStatus" class="input" style="max-width:180px;">
          <option value="">Semua status</option>
          <option value="issued">Issued</option>
          <option value="delivered">Delivered</option>
          <option value="expired">Expired</option>
          <option value="cancelled">Cancelled</option>
        </select>

        <label style="display:flex;align-items:center;gap:4px;font-size:13px;">
          <input type="checkbox" id="filterOnlyActive">
          Hanya DO aktif (issued &amp; belum expired)
        </label>

        <input type="text" id="filterSearch" class="input"
               placeholder="Cari DO / SO / partner..."
               style="flex:1;min-width:180px;">
      </div>

      <!-- ===== List DO ===== -->
      <div id="doList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="./js/delivery-page.js"></script>
</body>
</html>
