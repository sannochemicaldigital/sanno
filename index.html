<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Internal Accounting</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; padding: 16px;
    }
    .card {
      background: #fff; padding: 32px; border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      width: 100%; max-width: 380px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; color: #1a1a1a; }
    p.sub { font-size: 13px; color: #666; margin: 0 0 24px; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: #333; }
    input {
      width: 100%; padding: 12px; font-size: 15px;
      border: 1px solid #d0d5dd; border-radius: 8px;
      margin-bottom: 16px; outline: none;
    }
    input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    button {
      width: 100%; padding: 12px; font-size: 15px; font-weight: 600;
      background: #2563eb; color: #fff; border: none; border-radius: 8px;
      cursor: pointer; transition: background 0.2s;
    }
    button:hover:not(:disabled) { background: #1d4ed8; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error {
      display: none; background: #fef2f2; color: #b91c1c;
      padding: 10px 12px; border-radius: 8px; font-size: 13px;
      margin-bottom: 16px; border: 1px solid #fecaca;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>SANNO Accounting</h1>
    <p class="sub">Masuk untuk melanjutkan</p>

    <div id="errorMsg" class="error"></div>

    <form id="loginForm">
      <label for="email">Email / Username</label>
      <input type="text" id="email" autocomplete="username" required
             placeholder="nama@perusahaan.com">

      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required
             placeholder="••••••••">

      <button type="submit" id="loginBtn">Masuk</button>
    </form>
  </div>

  <script type="module" src="./js/auth.js"></script>
  <script type="module">
    // Script kecil di halaman: hubungkan form ke fungsi login dari auth.js
    import { login } from './js/auth.js';

    const form    = document.getElementById('loginForm');
    const emailEl = document.getElementById('email');
    const passEl  = document.getElementById('password');
    const btn     = document.getElementById('loginBtn');
    const errBox  = document.getElementById('errorMsg');

    function showError(msg) {
      errBox.textContent = msg;
      errBox.classList.add('show');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Memuat...';

      try {
        await login(emailEl.value, passEl.value);
        // Login sukses → redirect ke dashboard
        window.location.href = './dashboard.html';
      } catch (err) {
        const msg = (err.message || '').toLowerCase().includes('invalid')
          ? 'Email atau password salah.'
          : (err.message || 'Gagal login. Coba lagi.');
        showError(msg);
        btn.disabled = false;
        btn.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
