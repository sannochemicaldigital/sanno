<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — SANNO Accounting</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>Dashboard</h1>
      <button class="btn btn-danger" id="logoutBtn">Keluar</button>
    </div>

    <nav class="nav">
  <a href="./dashboard.html">Dashboard</a>
  <a href="./master.html">Master</a>
  <a href="./journal.html">Jurnal</a>
  <a href="./reports.html">Laporan</a>
  <a href="./settings.html" id="navSettings" style="display:none;">Pengaturan</a>
</nav>

    <div id="cards" class="grid"></div>
  </div>

  <script type="module">
    import { requireAuth, logout } from './js/auth.js';
    import { dashboardBalances } from './js/reports.js';
    import { hasRole } from './js/auth.js';
if (await hasRole('admin')) {
  document.getElementById('navSettings').style.display = '';
}

    const fmt = n => 'Rp ' + Number(n).toLocaleString('id-ID');

    (async () => {
      const user = await requireAuth();
      if (!user) return;

      document.getElementById('logoutBtn').addEventListener('click', logout);

      try {
        const data = await dashboardBalances();
        document.getElementById('cards').innerHTML = data.map(d => `
          <div class="card">
            <div style="font-size:12px;color:#666;margin-bottom:6px;">${d.label}</div>
            <div style="font-size:18px;font-weight:600;">${fmt(d.balance)}</div>
          </div>
        `).join('');
      } catch (err) {
        console.error('dashboardBalances error:', err);
        document.getElementById('cards').innerHTML =
          `<div class="card" style="grid-column:1/-1;">
             <div style="font-size:13px;color:#b91c1c;">
               Gagal memuat: <b>${err.message || err}</b>
               ${err.code ? `<br>Code: ${err.code}` : ''}
             </div>
           </div>`;
      }
    })();
  </script>
</body>
</html>
