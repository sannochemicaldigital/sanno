<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Internal Accounting</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f4f6f8; margin: 0; padding: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0; }
    button.logout { background: #dc2626; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .card { background: #fff; padding: 16px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .card .label { font-size: 12px; color: #666; margin-bottom: 6px; }
    .card .value { font-size: 18px; font-weight: 600; color: #111; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Dashboard</h1>
    <button class="logout" id="logoutBtn">Keluar</button>
  </div>
  <div id="cards" class="grid"></div>

  <script type="module">
    import { requireAuth, logout } from './js/auth.js';
    import { dashboardBalances } from './js/reports.js';

    const fmt = n => 'Rp ' + Number(n).toLocaleString('id-ID');

    (async () => {
      const user = await requireAuth();
      if (!user) return;

      document.getElementById('logoutBtn').addEventListener('click', logout);

      try {
        const data = await dashboardBalances();
        document.getElementById('cards').innerHTML = data.map(d => `
          <div class="card">
            <div class="label">${d.label}</div>
            <div class="value">${fmt(d.balance)}</div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
        document.getElementById('cards').innerHTML =
          `<div class="card">Gagal memuat: ${err.message}</div>`;
      }
    })();
  </script>
</body>
</html>
