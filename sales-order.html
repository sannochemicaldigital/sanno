<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Order — Sanno Accounting</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>Sales Order</h1>
      <button class="btn btn-danger" id="logoutBtn">Keluar</button>
    </div>

    <nav class="nav" id="mainNav"></nav>

    <!-- FORM SO -->
    <div class="card">
      <h3 style="margin-top:0;font-size:16px;" id="formTitle">Sales Order Baru</h3>
      <form id="form-so">
        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(150px,1fr));">
          <div class="form-row">
            <label>Tanggal SO</label>
            <input type="date" name="so_date" required>
          </div>
          <div class="form-row">
            <label>Pelanggan</label>
            <select name="partner_id" id="partnerSelect" required>
              <option value="">— pilih pelanggan —</option>
            </select>
          </div>
          <div class="form-row">
            <label>Jatuh Tempo</label>
            <select name="payment_terms_days" required>
              <option value="0">Cash / COD (0 hari)</option>
              <option value="7">7 hari</option>
              <option value="14">14 hari</option>
              <option value="30" selected>30 hari (default)</option>
              <option value="45">45 hari</option>
              <option value="60">60 hari</option>
              <option value="90">90 hari</option>
            </select>
          </div>
          <div class="form-row" style="grid-column: span 2;">
            <label>Deskripsi</label>
            <input name="description" placeholder="Catatan SO">
          </div>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;">
          <label style="font-size:13px;font-weight:500;">Baris Item</label>
          <button type="button" class="btn btn-secondary" id="addLineBtn">+ Tambah Item</button>
        </div>

        <!-- Tabel baris item -->
        <div class="table-wrap" style="margin-top:8px;">
          <table class="so-line-table">
            <colgroup>
              <col style="width:22%;">   <!-- Item -->
              <col style="width:8%;">    <!-- Qty -->
              <col style="width:11%;">   <!-- Harga PL -->
              <col style="width:12%;">   <!-- Harga Diajukan -->
              <col style="width:8%;">    <!-- Diskon % -->
              <col style="width:12%;">   <!-- Harga Efektif -->
              <col style="width:12%;">   <!-- Status -->
              <col style="width:15%;">   <!-- Alasan Override -->
              <col style="width:40px;">  <!-- Hapus -->
            </colgroup>
            <thead>
              <tr>
                <th>Item</th>
                <th class="num">Qty</th>
                <th class="num">Harga PL</th>
                <th class="num">Harga Diajukan</th>
                <th class="num">Diskon %</th>
                <th class="num">Harga Efektif</th>
                <th>Status</th>
                <th>Alasan Override</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="soLines">
              <!-- baris di-render oleh JS (v5.F3) -->
            </tbody>
          </table>
        </div>

        <div class="journal-summary" style="margin-top:12px;">
          <div>Total: <span id="totalAmount">Rp 0</span></div>
          <div id="ppnInfo" style="font-size:13px;color:#6b7280;"></div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="saveBtn">Simpan Draft</button>
          <button type="button" class="btn btn-secondary" id="cancelBtn" style="display:none;">Batal Edit</button>
        </div>
      </form>
    </div>

    <!-- DAFTAR SO -->
    <div class="card">
      <h3 style="margin-top:0;font-size:16px;">Daftar Sales Order</h3>
      <div id="soList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- CSS tambahan untuk baris item SO -->
  <style>
    .so-line-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .so-line-table th,
    .so-line-table td {
      padding: 6px 4px;
      font-size: 12px;
      vertical-align: middle;
    }
    .so-line-table th {
      text-align: left;
      font-size: 11px;
      color: #6b7280;
      font-weight: 600;
      border-bottom: 1px solid #e5e7eb;
      white-space: nowrap;
    }
    .so-line-table th.num { text-align: right; }
    .so-line-table td.num { text-align: right; }
    .so-line-table input,
    .so-line-table select {
      width: 100%;
      padding: 5px 6px;
      border: 1px solid #d0d5dd;
      border-radius: 5px;
      font-size: 12px;
      box-sizing: border-box;
    }
    .so-line-table input.pl-readonly,
    .so-line-table input.line-eff {
      background: #f9fafb;
      color: #374151;
      text-align: right;
      font-family: "Courier New", monospace;
    }
    .so-line-table input.line-eff {
      font-weight: 600;
    }
    .so-line-table .line-remove {
      background: #fee2e2;
      color: #991b1b;
      border: none;
      border-radius: 5px;
      width: 26px;
      height: 26px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 700;
      padding: 0;
    }
    .so-line-table .line-remove:hover { background: #fecaca; }
    .so-badge {
      display: inline-block;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .so-badge.ok      { background: #d1fae5; color: #065f46; }
    .so-badge.pending { background: #fef3c7; color: #92400e; }
    .so-badge.no-pl   { background: #fee2e2; color: #991b1b; }
    .so-line-table input.line-override-reason {
      font-size: 12px;
    }
    .so-line-table input.line-override-reason[disabled] {
      background: #f9fafb;
      cursor: not-allowed;
      opacity: 0.6;
    }
  </style>

  <script type="module" src="./js/sales-order-page.js"></script>
</body>
</html>
