<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Order — Sanno Accounting</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>Sales Order</h1>
      <button class="btn btn-danger" id="logoutBtn">Keluar</button>
    </div>

    <nav class="nav" id="mainNav"></nav>

    <!-- FORM SO -->
    <div class="card">
      <h3 style="margin-top:0;font-size:16px;" id="formTitle">Sales Order Baru</h3>
      <form id="form-so">
        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(150px,1fr));">
          <div class="form-row">
            <label>Tanggal SO</label>
            <input type="date" name="so_date" required>
          </div>
          <div class="form-row">
            <label>Pelanggan</label>
            <select name="partner_id" id="partnerSelect" required>
              <option value="">— pilih pelanggan —</option>
            </select>
          </div>
          <div class="form-row">
            <label>Jatuh Tempo</label>
            <select name="payment_terms_days" required>
              <option value="0">Cash / COD (0 hari)</option>
              <option value="7">7 hari</option>
              <option value="14">14 hari</option>
              <option value="30" selected>30 hari (default)</option>
              <option value="45">45 hari</option>
              <option value="60">60 hari</option>
              <option value="90">90 hari</option>
            </select>
          </div>
          <div class="form-row" style="grid-column: span 2;">
            <label>Deskripsi</label>
            <input name="description" placeholder="Catatan SO">
          </div>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;">
          <label style="font-size:13px;font-weight:500;">Baris Item</label>
          <button type="button" class="btn btn-secondary" id="addLineBtn">+ Tambah Item</button>
        </div>

        <!-- Header kolom baris item (desktop) -->
        <div class="so-line-header" style="display:grid;grid-template-columns:minmax(140px,1.4fr) 70px 110px 110px 70px 110px minmax(140px,1fr) minmax(140px,1fr) 32px;gap:6px;margin-top:8px;margin-bottom:4px;font-size:11px;color:#6b7280;font-weight:600;">
          <div>Item</div>
          <div>Qty</div>
          <div>Harga PL</div>
          <div>Harga Diajukan</div>
          <div>Diskon %</div>
          <div>Harga Efektif</div>
          <div>Status</div>
          <div>Alasan Override</div>
          <div></div>
        </div>

        <div class="so-lines" id="soLines"></div>

        <div class="journal-summary" style="margin-top:12px;">
          <div>Total: <span id="totalAmount">Rp 0</span></div>
          <div id="ppnInfo" style="font-size:13px;color:#6b7280;"></div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="saveBtn">Simpan Draft</button>
          <button type="button" class="btn btn-secondary" id="cancelBtn" style="display:none;">Batal Edit</button>
        </div>
      </form>
    </div>

    <!-- DAFTAR SO -->
    <div class="card">
      <h3 style="margin-top:0;font-size:16px;">Daftar Sales Order</h3>
      <div id="soList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- CSS tambahan untuk baris item SO -->
  <style>
    .so-line-row {
      display: grid;
      grid-template-columns: minmax(140px,1.4fr) 70px 110px 110px 70px 110px minmax(140px,1fr) minmax(140px,1fr) 32px;
      gap: 6px;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #f3f4f6;
    }
    .so-line-row select,
    .so-line-row input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #d0d5dd;
      border-radius: 6px;
      font-size: 13px;
      box-sizing: border-box;
    }
    .so-line-row .pl-readonly {
      background: #f9fafb;
      color: #374151;
      text-align: right;
      font-family: "Courier New", monospace;
      font-size: 12px;
    }
    .so-line-row .line-disc {
      text-align: right;
    }
    .so-line-row .line-eff {
      background: #f9fafb;
      text-align: right;
      font-weight: 600;
      font-size: 13px;
    }
    .so-line-row .line-subtotal {
      display: none; /* subtotal dihapus, diganti Total di bawah */
    }
    .so-line-row .line-remove {
      background: #fee2e2;
      color: #991b1b;
      border: none;
      border-radius: 6px;
      width: 28px;
      height: 28px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 700;
    }
    .so-line-row .line-remove:hover {
      background: #fecaca;
    }
    .so-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      text-align: center;
    }
    .so-badge.ok      { background: #d1fae5; color: #065f46; }
    .so-badge.pending { background: #fef3c7; color: #92400e; }
    .so-badge.no-pl   { background: #fee2e2; color: #991b1b; }
    .so-line-row .line-override-reason {
      font-size: 12px;
    }
    .so-line-row .line-override-reason[disabled] {
      background: #f9fafb;
      cursor: not-allowed;
    }
    /* Mobile: stack */
    @media (max-width: 900px) {
      .so-line-header { display: none; }
      .so-line-row {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        padding: 10px;
        background: #f9fafb;
        border-radius: 8px;
        margin-bottom: 8px;
      }
      .so-line-row > * {
        min-width: 0;
      }
    }
  </style>

  <script type="module" src="./js/sales-order-page.js"></script>
</body>
</html>
