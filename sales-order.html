<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Order — Sanno Accounting</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>Sales Order</h1>
      <button class="btn btn-danger" id="logoutBtn">Keluar</button>
    </div>

    <nav class="nav" id="mainNav"></nav>

    <!-- FORM SO -->
    <div class="card">
      <h3 style="margin-top:0;font-size:16px;" id="formTitle">Sales Order Baru</h3>
      <form id="form-so">
        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(150px,1fr));">
          <div class="form-row">
            <label>Tanggal SO</label>
            <input type="date" name="so_date" required>
          </div>
          <div class="form-row">
            <label>Pelanggan</label>
            <select name="partner_id" id="partnerSelect" required>
              <option value="">— pilih pelanggan —</option>
            </select>
          </div>
          <div class="form-row">
            <label>Jatuh Tempo</label>
            <select name="payment_terms_days" required>
              <option value="0">Cash / COD (0 hari)</option>
              <option value="7">7 hari</option>
              <option value="14">14 hari</option>
              <option value="30" selected>30 hari (default)</option>
              <option value="45">45 hari</option>
              <option value="60">60 hari</option>
              <option value="90">90 hari</option>
            </select>
          </div>
          <div class="form-row" style="grid-column: span 2;">
            <label>Deskripsi</label>
            <input name="description" placeholder="Catatan SO">
          </div>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
          <label style="font-size:13px;font-weight:500;">Baris Item</label>
          <button type="button" class="btn btn-secondary" id="addLineBtn">+ Tambah Item</button>
        </div>

        <div class="journal-lines" id="soLines"></div>

        <div class="journal-summary">
          <div>Total: <span id="totalAmount">Rp 0</span></div>
          <div id="ppnInfo" style="font-size:13px;color:#6b7280;"></div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="saveBtn">Simpan Draft</button>
          <button type="button" class="btn btn-secondary" id="cancelBtn" style="display:none;">Batal Edit</button>
        </div>
      </form>
    </div>

    <!-- DAFTAR SO -->
    <div class="card">
      <h3 style="margin-top:0;font-size:16px;">Daftar Sales Order</h3>
      <div id="soList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="./js/sales-order-page.js"></script>
</body>
</html>
