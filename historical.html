<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice Historis — Sanno Accounting</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📜</text></svg>">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>Invoice Historis</h1>
      <button class="btn btn-danger" id="logoutBtn">Keluar</button>
    </div>

    <nav class="nav" id="mainNav"></nav>

    <!-- Ringkasan -->
    <div class="card" id="summaryCard">
      <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:center;">
        <div>
          <div style="font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;">Total Invoice</div>
          <div style="font-size:20px;font-weight:600;" id="sumInvoices">—</div>
        </div>
        <div>
          <div style="font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;">Total Line</div>
          <div style="font-size:20px;font-weight:600;" id="sumLines">—</div>
        </div>
        <div>
          <div style="font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;">Subtotal</div>
          <div style="font-size:20px;font-weight:600;" id="sumSubtotal">—</div>
        </div>
        <div>
          <div style="font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;">PPN</div>
          <div style="font-size:20px;font-weight:600;" id="sumPpn">—</div>
        </div>
        <div>
          <div style="font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;">Total IDR</div>
          <div style="font-size:20px;font-weight:600;color:#0891b2;" id="sumTotalIdr">—</div>
        </div>
      </div>
    </div>

    <!-- Filter + tabel -->
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
        <h3 style="margin:0;font-size:16px;">Daftar Invoice</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button type="button" class="btn btn-secondary" id="exportInvBtn" style="display:none;padding:8px 14px;font-size:13px;">⬇️ Export Invoice (CSV)</button>
          <button type="button" class="btn btn-secondary" id="exportLineBtn" style="display:none;padding:8px 14px;font-size:13px;">⬇️ Export Line (CSV)</button>
        </div>
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;">
        <input type="text" id="fSearch" class="input" placeholder="Cari invoice / partner..." style="flex:1;min-width:200px;">
        <select id="fPartner" class="input" style="max-width:200px;">
          <option value="">Semua partner</option>
        </select>
        <select id="fSales" class="input" style="max-width:140px;">
          <option value="">Semua sales</option>
        </select>
        <select id="fStatus" class="input" style="max-width:140px;">
          <option value="">Semua status</option>
          <option value="posted">Posted</option>
          <option value="partial">Partial</option>
          <option value="paid">Paid</option>
        </select>
        <select id="fCurrency" class="input" style="max-width:120px;">
          <option value="">Semua currency</option>
          <option value="IDR">IDR</option>
          <option value="USD">USD</option>
        </select>
        <input type="date" id="fFrom" class="input" title="Dari tanggal (dev date)">
        <input type="date" id="fTo" class="input" title="Sampai tanggal (dev date)">
        <button type="button" class="btn btn-secondary" id="fResetBtn" style="padding:8px 14px;font-size:13px;">Reset</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Invoice No</th>
              <th>Partner</th>
              <th>Sales</th>
              <th>Dev Date</th>
              <th>Due Date</th>
              <th>Curr</th>
              <th class="num">Subtotal</th>
              <th class="num">PPN (IDR)</th>
              <th class="num">Total IDR</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tbody-invoices">
            <tr><td colspan="10" style="text-align:center;color:#9ca3af;padding:16px;">Memuat...</td></tr>
          </tbody>
        </table>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap;gap:8px;">
        <div id="paginationInfo" style="font-size:12px;color:#6b7280;"></div>
        <div id="pagination" style="display:flex;gap:4px;flex-wrap:wrap;"></div>
      </div>
    </div>
  </div>

  <!-- Modal Detail -->
  <div id="detailModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;align-items:center;justify-content:center;padding:16px;">
    <div style="background:#fff;border-radius:10px;max-width:1100px;width:100%;max-height:90vh;overflow:auto;padding:20px;box-shadow:0 4px 24px rgba(0,0,0,.2);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3 style="margin:0;font-size:16px;" id="detailTitle">Detail Invoice</h3>
        <button type="button" id="detailCloseBtn"
                style="background:none;border:none;font-size:22px;cursor:pointer;color:#6b7280;padding:0 6px;">×</button>
      </div>
      <div id="detailHeader" style="margin-bottom:12px;"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Line</th>
              <th>SKU</th>
              <th>Nama</th>
              <th class="num">Qty</th>
              <th class="num">Isi</th>
              <th class="num">Harga</th>
              <th class="num">Total</th>
              <th class="num">PPN (IDR)</th>
              <th>Remark</th>
            </tr>
          </thead>
          <tbody id="detailLines"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="./js/historical-page.js"></script>
</body>
</html>
