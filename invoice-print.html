<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cetak Invoice — Sanno Accounting</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 12px;
      color: #1a1a1a;
      background: #f4f6f8;
      padding: 20px;
    }

    .toolbar {
      max-width: 210mm;
      margin: 0 auto 12px;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .toolbar button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .btn-print { background: #2563eb; color: #fff; }
    .btn-print:hover { background: #1d4ed8; }
    .btn-close { background: #e5e7eb; color: #374151; }
    .btn-close:hover { background: #d1d5db; }

    .paper {
      max-width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      background: #fff;
      padding: 15mm 15mm;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    /* Header */
    .company-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 3px solid #2563eb;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    .company-left { flex: 1; }
    .company-logo {
      max-height: 60px;
      max-width: 150px;
      margin-bottom: 8px;
    }
    .company-name {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 4px;
    }
    .company-info {
      font-size: 11px;
      color: #4b5563;
      line-height: 1.5;
    }
    .company-right {
      text-align: right;
      flex-shrink: 0;
    }
    .doc-title {
      font-size: 20px;
      font-weight: 700;
      color: #2563eb;
      margin-bottom: 4px;
    }
    .doc-number {
      font-size: 13px;
      color: #4b5563;
      margin-bottom: 2px;
    }
    .doc-date {
      font-size: 12px;
      color: #6b7280;
    }

    /* Info grid */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .info-block {
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 10px 12px;
    }
    .info-block-title {
      font-size: 10px;
      font-weight: 700;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .info-block-name {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 2px;
    }
    .info-block-detail {
      font-size: 11px;
      color: #4b5563;
      line-height: 1.5;
    }

    /* Tabel item */
    .items-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      font-size: 12px;
    }
    .items-table thead { background: #f3f4f6; }
    .items-table th {
      padding: 8px 10px;
      text-align: left;
      font-weight: 600;
      font-size: 11px;
      color: #374151;
      border-bottom: 2px solid #d1d5db;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .items-table th.num { text-align: right; }
    .items-table td {
      padding: 8px 10px;
      border-bottom: 1px solid #e5e7eb;
      vertical-align: top;
    }
    .items-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .items-table tbody tr:last-child td { border-bottom: 1px solid #d1d5db; }
    .items-table tfoot td {
      padding: 8px 10px;
      font-weight: 600;
    }
    .items-table tfoot td.label { text-align: right; color: #374151; }
    .items-table tfoot td.value { text-align: right; font-variant-numeric: tabular-nums; }
    .items-table tfoot tr.grand td {
      background: #eff6ff;
      font-size: 14px;
      color: #1e40af;
    }

    /* Pembayaran */
    .payment-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
      margin-bottom: 20px;
    }
    .payment-block {
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 10px 12px;
      background: #fafafa;
    }
    .payment-block-title {
      font-size: 11px;
      font-weight: 700;
      color: #2563eb;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .payment-block-detail {
      font-size: 11px;
      color: #4b5563;
      line-height: 1.6;
    }
    .payment-block-detail b {
      color: #1a1a1a;
    }

    /* Tanda tangan */
    .signatures {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-top: 40px;
    }
    .sig-box { text-align: center; }
    .sig-label {
      font-size: 11px;
      color: #6b7280;
      margin-bottom: 60px;
    }
    .sig-line {
      border-top: 1px solid #374151;
      padding-top: 6px;
      font-size: 11px;
      color: #374151;
    }

    /* Footer */
    .footer-notes {
      margin-top: 30px;
      padding-top: 12px;
      border-top: 1px dashed #d1d5db;
      font-size: 10px;
      color: #6b7280;
      font-style: italic;
    }
    .printed-at {
      margin-top: 8px;
      font-size: 9px;
      color: #9ca3af;
      text-align: right;
    }

    .loading, .error {
      text-align: center;
      padding: 60px 20px;
      font-size: 14px;
      color: #6b7280;
    }
    .error { color: #b91c1c; }

    @media print {
      body { background: #fff; padding: 0; }
      .toolbar { display: none; }
      .paper {
        box-shadow: none;
        margin: 0;
        padding: 0;
        max-width: 100%;
        min-height: auto;
      }
      @page {
        size: A4;
        margin: 15mm;
      }
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <button class="btn-close" onclick="window.close()">Tutup</button>
    <button class="btn-print" onclick="window.print()">🖨 Cetak / Save PDF</button>
  </div>

  <div class="paper" id="paper">
    <div class="loading">Memuat data Invoice...</div>
  </div>

  <script type="module">
    import { requireAuth } from './js/auth.js';
    import { getCompanyProfile } from './js/company.js';
    import { supabase } from './js/supabase-client.js';

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));

    function fmtMoney(n) {
      return 'Rp ' + Number(n || 0).toLocaleString('id-ID', {
        minimumFractionDigits: 0, maximumFractionDigits: 2
      });
    }
    function fmtQty(n) {
      return Number(n || 0).toLocaleString('id-ID', {
        minimumFractionDigits: 0, maximumFractionDigits: 4
      });
    }
    function fmtDate(d) {
      if (!d) return '—';
      return new Date(d).toLocaleDateString('id-ID', {
        day: '2-digit', month: 'long', year: 'numeric'
      });
    }

    (async () => {
      const user = await requireAuth();
      if (!user) return;

      const paper = document.getElementById('paper');

      try {
        // 1. Ambil SO id dari URL
        const params = new URLSearchParams(window.location.search);
        const soId = Number(params.get('id'));
        if (!soId) throw new Error('Parameter ?id= tidak ada di URL');

        // 2. Fetch SO + partner
        const { data: so, error: soErr } = await supabase
          .from('sales_orders')
          .select(`
            *,
            partners!inner(code, name, phone, email, address)
          `)
          .eq('id', soId)
          .single();
        if (soErr) throw soErr;

        if (so.status !== 'posted') {
          throw new Error(`SO belum posted (status: ${so.status}). Invoice hanya bisa dibuat untuk SO posted.`);
        }

        // 3. Fetch lines
        const { data: lines, error: lErr } = await supabase
          .from('sales_order_lines')
          .select('*, items!inner(sku, name, unit)')
          .eq('so_id', soId)
          .order('id');
        if (lErr) throw lErr;

        // 4. Fetch company profile
        const company = await getCompanyProfile();

        // 5. Ambil info rekening bank dari COA (1-11xx)
        const { data: bankAccounts } = await supabase
          .from('accounts')
          .select('code, name')
          .like('code', '1-11%')
          .eq('is_active', true)
          .order('code');

        // 6. Render
        const partner = so.partners;
        const totalAmount = Number(so.total_amount);
        const ppnAmount = Number(so.ppn_amount);
        const grandTotal = Number(so.grand_total);

        let itemsHtml = '';
        lines.forEach((l, i) => {
          itemsHtml += `
            <tr>
              <td style="text-align:center;">${i + 1}</td>
              <td>${esc(l.items.sku)}</td>
              <td>${esc(l.items.name)}</td>
              <td class="num">${fmtQty(l.qty)}</td>
              <td>${esc(l.items.unit)}</td>
              <td class="num">${fmtMoney(l.unit_price)}</td>
              <td class="num">${fmtMoney(l.subtotal)}</td>
            </tr>`;
        });

        const bankList = (bankAccounts || [])
          .map(b => `<div>• <b>${esc(b.name)}</b></div>`)
          .join('');

        // Nomor invoice: pakai so_no dengan prefix INV
        const invoiceNo = `INV-${so.so_no.replace('SO-', '')}`;

        paper.innerHTML = `
          <div class="company-header">
            <div class="company-left">
              ${company.logo_url ? `<img src="${esc(company.logo_url)}" alt="Logo" class="company-logo">` : ''}
              <div class="company-name">${esc(company.name || 'Perusahaan')}</div>
              <div class="company-info">
                ${company.address ? esc(company.address) + '<br>' : ''}
                ${company.phone ? 'Telp: ' + esc(company.phone) : ''}
                ${company.phone && company.email ? ' · ' : ''}
                ${company.email ? 'Email: ' + esc(company.email) : ''}
                ${company.website ? '<br>' + esc(company.website) : ''}
                ${company.tax_id ? '<br>NPWP: ' + esc(company.tax_id) : ''}
              </div>
            </div>
            <div class="company-right">
              <div class="doc-title">INVOICE</div>
              <div class="doc-number">No: <b>${esc(invoiceNo)}</b></div>
              <div class="doc-date">Tanggal: ${fmtDate(so.so_date)}</div>
              <div class="doc-date" style="font-size:11px;margin-top:4px;">Ref SO: ${esc(so.so_no)}</div>
            </div>
          </div>

          <div class="info-grid">
            <div class="info-block">
              <div class="info-block-title">Ditagihkan Kepada</div>
              <div class="info-block-name">${esc(partner.name)}</div>
              <div class="info-block-detail">
                ${partner.address ? esc(partner.address) + '<br>' : ''}
                ${partner.phone ? 'Telp: ' + esc(partner.phone) : ''}
                ${partner.email ? '<br>Email: ' + esc(partner.email) : ''}
              </div>
            </div>
            <div class="info-block">
              <div class="info-block-title">Keterangan</div>
              <div class="info-block-detail">
                Status: <b style="color:#059669;">LUNAS BELUM DIBAYAR</b><br>
                Jatuh Tempo: <b>${fmtDate(new Date(new Date(so.so_date).getTime() + 30*24*60*60*1000))}</b><br>
                ${so.description ? 'Catatan: ' + esc(so.description) : ''}
              </div>
            </div>
          </div>

          <table class="items-table">
            <thead>
              <tr>
                <th style="width:30px;text-align:center;">No</th>
                <th style="width:90px;">SKU</th>
                <th>Nama Barang</th>
                <th class="num" style="width:70px;">Qty</th>
                <th style="width:50px;">Satuan</th>
                <th class="num" style="width:100px;">Harga</th>
                <th class="num" style="width:110px;">Subtotal</th>
              </tr>
            </thead>
            <tbody>
              ${itemsHtml || '<tr><td colspan="7" style="text-align:center;color:#9ca3af;">Tidak ada item</td></tr>'}
            </tbody>
            <tfoot>
              <tr>
                <td colspan="6" class="label">Total</td>
                <td class="value">${fmtMoney(totalAmount)}</td>
              </tr>
              ${ppnAmount > 0 ? `
              <tr>
                <td colspan="6" class="label">PPN</td>
                <td class="value">${fmtMoney(ppnAmount)}</td>
              </tr>` : ''}
              <tr class="grand">
                <td colspan="6" class="label">GRAND TOTAL</td>
                <td class="value">${fmtMoney(grandTotal)}</td>
              </tr>
            </tfoot>
          </table>

          <div class="payment-section">
            <div class="payment-block">
              <div class="payment-block-title">Instruksi Pembayaran</div>
              <div class="payment-block-detail">
                Silakan transfer ke rekening berikut:
                ${bankList || '<div style="color:#9ca3af;">Belum ada rekening bank terdaftar</div>'}
                <div style="margin-top:8px;font-size:10px;color:#6b7280;">
                  Mohon cantumkan nomor invoice <b>${esc(invoiceNo)}</b> pada berita transfer.
                </div>
              </div>
            </div>
            <div class="payment-block">
              <div class="payment-block-title">Ringkasan</div>
              <div class="payment-block-detail">
                Total: <b>${fmtMoney(totalAmount)}</b><br>
                PPN: <b>${fmtMoney(ppnAmount)}</b><br>
                <span style="font-size:13px;">Grand Total: <b style="color:#1e40af;">${fmtMoney(grandTotal)}</b></span>
              </div>
            </div>
          </div>

          <div class="signatures">
            <div class="sig-box">
              <div class="sig-label">Hormat Kami,</div>
              <div class="sig-line">( _________________________ )</div>
            </div>
            <div class="sig-box">
              <div class="sig-label">Diterima Oleh,</div>
              <div class="sig-line">( _________________________ )</div>
            </div>
          </div>

          ${company.notes ? `<div class="footer-notes">${esc(company.notes)}</div>` : ''}
          <div class="printed-at">Dicetak: ${new Date().toLocaleString('id-ID')}</div>
        `;

        document.title = `${invoiceNo} — ${company.name || 'Sanno Accounting'}`;

      } catch (err) {
        console.error('[invoice-print] error:', err);
        paper.innerHTML = `
          <div class="error">
            <div style="font-size:16px;font-weight:600;margin-bottom:8px;">Gagal memuat Invoice</div>
            <div>${esc(err.message || err)}</div>
            <div style="margin-top:16px;font-size:12px;color:#9ca3af;">
              Pastikan URL memiliki <code>?id=</code> SO yang valid (status posted).
            </div>
          </div>`;
      }
    })();
  </script>
</body>
</html>
