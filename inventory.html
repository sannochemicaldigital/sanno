<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory — Sanno Accounting</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>Inventory</h1>
      <button class="btn btn-danger" id="logoutBtn">Keluar</button>
    </div>

    <nav class="nav" id="mainNav"></nav>

    <div class="card">
      <h3 style="margin-top:0;font-size:16px;">Daftar Stok</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>SKU</th><th>Nama</th><th>Satuan</th><th class="num">Stok</th><th class="num">Min</th><th>Status</th></tr>
          </thead>
          <tbody id="tbody-inventory"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="./js/inventory-page.js"></script>
</body>
</html>
