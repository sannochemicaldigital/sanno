<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Jurnal — Sanno Accounting</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>Input Jurnal</h1>
      <button class="btn btn-danger" id="logoutBtn">Keluar</button>
    </div>

    <nav class="nav" id="mainNav"></nav>

    <div class="card">
      <h3 style="margin-top:0;font-size:16px;" id="formTitle">Jurnal Baru</h3>
      <form id="form-journal">
        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(150px,1fr));">
          <div class="form-row"><label>Tanggal</label><input type="date" name="journal_date" required></div>
          <div class="form-row"><label>Deskripsi</label><input name="description" placeholder="mis. Penjualan tunai" required></div>
          <div class="form-row"><label>No. Referensi</label><input name="ref_no" placeholder="opsional"></div>
          <div class="form-row">
            <label>Mata Uang Dokumen</label>
            <select name="currency_code" id="currencySelect"><option value="IDR">IDR</option></select>
          </div>
          <div class="form-row" id="rateRow" style="display:none;">
            <label>Kurs Default (non-IDR)</label>
            <input name="exchange_rate" type="number" step="0.000001" placeholder="18305">
          </div>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:12px;flex-wrap:wrap;">
          <div>
            <label style="font-size:13px;font-weight:500;">Baris Jurnal</label>
            <div style="font-size:11px;color:#6b7280;">
              Valuta &amp; kurs diisi <b>per baris</b> — boleh campur USD dan IDR dalam satu jurnal.
              Kolom <b>Rupiah</b> = nominal &times; kurs (otomatis).
            </div>
          </div>
          <button type="button" class="btn btn-secondary" id="addLineBtn">+ Tambah Baris</button>
        </div>

        <div class="journal-lines" id="journalLines"></div>

        <div class="journal-summary">
          <div class="sum-left">
            <div id="totalByCurrency" class="sum-cur" style="display:none;"></div>
            <div class="sum-base">
              Basis Rupiah — Debit: <span id="totalDebit">Rp 0</span>
              &nbsp;|&nbsp; Kredit: <span id="totalCredit">Rp 0</span>
            </div>
          </div>
          <div id="balanceStatus" class="balance-bad">Belum balance</div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="saveBtn" disabled>Simpan Jurnal</button>
          <button type="button" class="btn btn-secondary" id="resetBtn">Reset</button>
          <button type="button" class="btn btn-secondary" id="cancelEditBtn" style="display:none;">Batal Edit</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h3 style="margin-top:0;font-size:16px;" id="journalListTitle">Jurnal Terakhir</h3>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px;">
        <div class="form-row" style="margin:0;min-width:220px;flex:1 1 220px;">
          <label for="journalSearch">Cari Jurnal</label>
          <input id="journalSearch" placeholder="No. jurnal / keterangan, mis. KASADJ atau KAS-202611">
        </div>
        <div class="form-row" style="margin:0;">
          <label for="journalFrom">Dari Tanggal</label>
          <input type="date" id="journalFrom">
        </div>
        <div class="form-row" style="margin:0;">
          <label for="journalTo">Sampai Tanggal</label>
          <input type="date" id="journalTo">
        </div>
        <button type="button" class="btn btn-primary" id="journalSearchBtn">Cari</button>
        <button type="button" class="btn btn-secondary" id="journalResetBtn">Reset</button>
      </div>
      <div id="journalList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="./js/journal-form.js?v=11.33"></script>
</body>
</html>
